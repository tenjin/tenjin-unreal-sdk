name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please updates VersionName in the .uplugin, but Unreal also needs the
  # integer Version to go up on every release, which release-please cannot do.
  # Set it to main's Version + 1 on the release PR branch.
  bump-plugin-version:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          fetch-depth: 0

      - name: Bump Version in TenjinSDK.uplugin
        run: |
          FILE=TenjinSDK/TenjinSDK.uplugin
          MAIN_VERSION=$(git show origin/main:$FILE | jq '.Version')
          NEW_VERSION=$((MAIN_VERSION + 1))
          sed -i -E "s/^(\s*\"Version\": )[0-9]+,/\1${NEW_VERSION},/" $FILE
          if git diff --quiet; then
            echo "Version is already ${NEW_VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump plugin Version to ${NEW_VERSION}"
          git push
